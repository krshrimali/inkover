# inkover binds for a classic hyprland.conf
bind = SUPER ALT, D, exec, ~/.local/bin/inkover toggle
bind = SUPER ALT, C, exec, ~/.local/bin/inkover clear all
bind = SUPER ALT, S, exec, ~/.local/bin/inkover screenshot region
bind = SUPER ALT, V, exec, ~/.local/bin/inkover record region
bind = SUPER ALT, G, exec, ~/.local/bin/inkover-gui
bind = SUPER ALT SHIFT, D, exec, ~/.local/bin/inkover quit
